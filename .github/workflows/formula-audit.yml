name: Formula Audit

on:
  push:
    branches:
      - main
  # A formula change arrives as a pull request, so guarding only pushes to main
  # means the sha256 check runs after the mistake has already landed. That is
  # how a formula naming 1.3.1 with 1.2.7's hashes reached main twice.
  pull_request:
    paths:
      - 'Formula/**'
      - '.github/workflows/formula-audit.yml'
  release:
    types:
      - published

concurrency:
  group: formula-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607  # no-tags; pinned 2026-05-03

      - name: Audit formula syntax (strict)
        # brew audit --strict validates Ruby syntax, SPDX license, and formula structure
        # against the local file — no install or live tap required.
        # Non-zero exit with warnings only (no "Error:" lines) is acceptable.
        run: |
          if ! brew audit --strict Formula/nself.rb 2>&1; then
            if brew audit --strict Formula/nself.rb 2>&1 | grep -qiE '^Error:'; then
              echo "::error::brew audit found errors"
              exit 1
            fi
            echo "::warning::brew audit has warnings (acceptable)"
          fi

      - name: Verify every formula SHA256 against its release tarball
        # This step existed and could not work, which is how a formula naming
        # 1.3.1 shipped carrying 1.2.7's hashes and broke `brew install nself`.
        #
        # Two reasons. It ran `if: github.event_name == 'release'`, and this tap
        # does not publish releases — the cli repo does — so it effectively
        # never ran. And it parsed a single url/sha256 pair, while this formula
        # is dual-arch: `grep '^\s\+sha256 '` matched both lines and collapsed
        # them into a 128-character string, which then failed its own 64-char
        # format check. Either way, no hash was ever compared.
        #
        # It now runs on every push and pull request, and checks EVERY pair.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FORMULA_FILE=$(find . -name "nself.rb" | head -1)
          if [ -z "$FORMULA_FILE" ]; then
            echo "::error::nself.rb formula not found"
            exit 1
          fi

          VERSION=$(grep -E '^\s+version "' "$FORMULA_FILE" | head -1 | sed 's/.*version "//; s/".*//')
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from $FORMULA_FILE"
            exit 1
          fi
          echo "Formula version: $VERSION"

          # Pair each url with the sha256 that follows it, so a dual-arch
          # formula is checked arch by arch rather than collapsed into one.
          pairs=$(awk '
            /^[[:space:]]*url "/     { u=$0; sub(/.*url "/,"",u); sub(/".*/,"",u); next }
            /^[[:space:]]*sha256 "/  { s=$0; sub(/.*sha256 "/,"",s); sub(/".*/,"",s);
                                       if (u != "") { print u "\t" s; u="" } }
          ' "$FORMULA_FILE")

          if [ -z "$pairs" ]; then
            echo "::error::no url/sha256 pairs found in $FORMULA_FILE"
            exit 1
          fi

          # The formula legitimately lands before the release in this project's
          # flow: the cli release workflow refuses to publish until the formula
          # names the new version. So a missing release is a wait, not a fault —
          # but a PRESENT release with a mismatched hash is always a fault.
          missing=0
          failed=0
          count=0

          while IFS="$(printf '\t')" read -r url sha; do
            [ -z "$url" ] && continue
            count=$((count + 1))
            url="${url//\$\{version\}/$VERSION}"
            url="${url//#\{version\}/$VERSION}"

            if ! echo "$sha" | grep -qE '^[a-f0-9]{64}$'; then
              echo "::error::malformed sha256 for $url: '$sha'"
              failed=1
              continue
            fi

            code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url" || echo 000)
            if [ "$code" = "404" ]; then
              echo "::notice::$url is not published yet — skipping (formula precedes the release by design)"
              missing=$((missing + 1))
              continue
            fi

            if ! curl -fsSL -o /tmp/asset.tar.gz "$url"; then
              echo "::error::failed to download $url (HTTP $code)"
              failed=1
              continue
            fi

            actual=$(shasum -a 256 /tmp/asset.tar.gz | awk '{print $1}')
            if [ "$actual" = "$sha" ]; then
              echo "OK   $(basename "$url")"
            else
              echo "::error::$(basename "$url") sha256 mismatch"
              echo "  formula:  $sha"
              echo "  released: $actual"
              echo "  A version bump that does not update the hashes produces exactly this,"
              echo "  and brew install fails for every user."
              failed=1
            fi
          done <<PAIRS
          $pairs
          PAIRS

          echo "checked $count url/sha256 pair(s); $missing not yet published"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
