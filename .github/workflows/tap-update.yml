name: Tap Auto-Update on CLI Release

# USER ACTION REQUIRED:
#   Set HOMEBREW_TAP_TOKEN in the *cli* repo secrets (nself-org/cli), which is
#   what sends the dispatch, and keep a matching token here for the push:
#     HOMEBREW_TAP_TOKEN — classic GitHub PAT with `repo` scope on
#                          nself-org/homebrew-nself. Mint at
#                          https://github.com/settings/tokens.
#   As of 2026-09-12 the cli-side token returns HTTP 401 (expired), so
#   release.yml skips the dispatch and this workflow does not fire. Releases
#   are updated by hand with `bump-version.sh --homebrew` until it is rotated.
#   Without HOMEBREW_TAP_TOKEN here, this workflow skips gracefully (no-op).
#
# Triggers on:
#   - repository_dispatch (type: cli-release) — sent by cli release.yml after publishing
#   - workflow_dispatch — manual update; takes a version, and derives the hashes
#
# This workflow is the canonical tap-update entry point. It is separate from
# update-formula.yml (which handles formula file edits) so that the tap-update
# trigger logic can be evolved independently. Both share one implementation:
# .github/scripts/update-formula.sh — see that file for why the formula must
# never be written with a single sed'd sha256.

on:
  repository_dispatch:
    types: [cli-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to update to (e.g. v1.1.1 or 1.1.1)'
        required: true

permissions:
  contents: read

# Both this workflow and update-formula.yml answer the same cli-release
# dispatch and both push to main. Sharing one literal group serialises them so
# the second sees the first's commit instead of racing it to a non-fast-forward.
concurrency:
  group: homebrew-formula-write
  cancel-in-progress: false

jobs:
  tap-update:
    name: Update Homebrew tap formula
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Preflight (HOMEBREW_TAP_TOKEN present)
        id: preflight
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping tap push."
            echo "::notice::Set HOMEBREW_TAP_TOKEN (GitHub PAT with repo scope) in nself-org/homebrew-nself secrets."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.preflight.outputs.proceed == 'true'
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update Formula/nself.rb from the release checksums
        id: info
        if: steps.preflight.outputs.proceed == 'true'
        env:
          # client_payload.sha256 is deliberately IGNORED. The cli release
          # workflow computes it from the GitHub *source* archive, which is not
          # what this formula installs — it installs the pre-built darwin
          # binaries. Writing that value into the arch blocks is the exact bug
          # this step replaces. The hashes come from the release's
          # checksums.txt, matched per asset filename.
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          bash .github/scripts/update-formula.sh \
            --version "${VERSION}" \
            --formula Formula/nself.rb

      - name: Verify formula syntax
        if: steps.preflight.outputs.proceed == 'true'
        run: ruby -c Formula/nself.rb

      - name: Assert the two arch hashes are distinct
        if: steps.preflight.outputs.proceed == 'true'
        # Belt and braces: the script already asserts this, but a formula is
        # never pushed from here without the check being visible in the log.
        run: bash .github/scripts/assert-dual-arch.sh Formula/nself.rb

      - name: Commit and push
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nself.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${{ steps.info.outputs.version }} — no update needed."
            exit 0
          fi
          git commit -m "formula: update nself to ${{ steps.info.outputs.version }}"
          git push origin main

      - name: Summary
        if: steps.preflight.outputs.proceed == 'true'
        run: |
          {
            echo "### Homebrew tap updated"
            echo "- Formula: \`Formula/nself.rb\`"
            echo "- Version: \`${{ steps.info.outputs.version }}\`"
            echo "- darwin-arm64 sha256: \`${{ steps.info.outputs.sha256_arm64 }}\`"
            echo "- darwin-amd64 sha256: \`${{ steps.info.outputs.sha256_amd64 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
