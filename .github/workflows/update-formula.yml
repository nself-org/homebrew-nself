name: Update Formula on Release

# Formula writer for a published CLI release.
#
# Shares its implementation with tap-update.yml via
# .github/scripts/update-formula.sh. Read the header of that script before
# changing anything here: the formula is dual-arch, and a single sed'd sha256
# silently corrupts BOTH arch blocks.
#
# Unlike tap-update.yml this workflow uses the default GITHUB_TOKEN, so it
# needs no secret and will run on the cli-release dispatch even while
# HOMEBREW_TAP_TOKEN is expired — which is precisely why its formula-writing
# logic had to be fixed rather than left dormant.

on:
  repository_dispatch:
    types: [cli-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to update to (e.g. v1.0.0)'
        required: true

# Shared with tap-update.yml: both answer cli-release and both push to main.
concurrency:
  group: homebrew-formula-write
  cancel-in-progress: false

jobs:
  update:
    name: Update nself.rb formula
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Update Formula/nself.rb from the release checksums
        id: info
        env:
          # client_payload.sha256 is deliberately IGNORED — see tap-update.yml
          # and .github/scripts/update-formula.sh. It is the source-archive
          # hash, not either darwin binary's.
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          bash .github/scripts/update-formula.sh \
            --version "${VERSION}" \
            --formula Formula/nself.rb

      - name: Verify formula syntax
        # Basic Ruby syntax check (brew audit not available without Homebrew)
        run: ruby -c Formula/nself.rb

      - name: Assert the two arch hashes are distinct
        run: bash .github/scripts/assert-dual-arch.sh Formula/nself.rb

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/nself.rb
          if git diff --cached --quiet; then
            echo "Formula already at ${{ steps.info.outputs.version }} — no update needed."
            exit 0
          fi
          git commit -m "formula: update nself to ${{ steps.info.outputs.version }}"
          git push origin main

      - name: Summary
        run: |
          {
            echo "### Formula updated"
            echo "- Version: \`${{ steps.info.outputs.version }}\`"
            echo "- darwin-arm64 sha256: \`${{ steps.info.outputs.sha256_arm64 }}\`"
            echo "- darwin-amd64 sha256: \`${{ steps.info.outputs.sha256_amd64 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
